spring:
  cloud:
    nacos:
      server-addr: ${server.nacos-ip} # nacos注册中心
      discovery:
        namespace: d287a4e1-225a-4254-bd10-947bc27f15de #命名空间
        group: DEFAULT_GROUP #组别
  elasticsearch:
    uris: ${server.sql-ip}:${server.port.es}  # Elasticsearch 地址
    connection-timeout: 5000ms
    socket-timeout: 60000ms
  data:
    elasticsearch:
      repositories:
        enabled: true
logging:
  level:
    org.springframework.data.elasticsearch.client.WIRE: trace  # 查看请求日志
# 自定义配置
elasticsearch:
  index:
    product: products
    user: users
  enable-ssl: false  # 是否启用SSL