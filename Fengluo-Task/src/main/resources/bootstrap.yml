server:
  port: 10010
  servlet:
    session:
      timeout: 30m
      cookie:
        max-age: 24h
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  application:
    name: TaskApplication
  cloud:
    nacos:
      config:
        namespace: d287a4e1-225a-4254-bd10-947bc27f15de  # 共享配置所在命名空间 Fengluo
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: sharding-spring.yaml # 共享spring配置
            refresh: false
          - data-id: sharding-redis.yaml # 共享redis配置
            refresh: false
          - data-id: sharding-logs.yaml # 共享日志配置
            refresh: false
          - data-id: sharding-mysql.yaml
            refresh: false
          - data-id: sharding-mq.yaml
            refresh: false
          - data-id: sharding-feign.yaml
            refresh: false
  profiles:
    active: dev
fl:
  redis:
    host: localhost # Redis地址
    password: ''            # 若无密码则留空
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 1
      max-wait: 300
  mysql:
    host: localhost
    port: 3306
    database: fl_task
    username: guilu
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  mq:
    host: 120.26.2.254
    port: 5672
    vhost: /maplefall
    username: guilu
    password: 123
  auth:
    resource:
      enable: true
      exclude-login-paths:
        - "maple/user/login"
        - "maple/user/refresh"
        - "maple/user/logout"
        - "maple/user/register"
        - "maple/user/applyCode"
monitor:
  threadpool:
    dynamic:
      enabled: true
  exception:
    enabled: true
  jvm:
    basic:
      enabled: false
    extras:
      enabled: false
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    metrics:
      enabled: true
    prometheus:
      enabled: true
