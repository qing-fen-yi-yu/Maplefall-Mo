server:
  port: 10010
  servlet:
    session:
      timeout: 30m
      cookie:
        max-age: 24h
  tomcat:
    uri-encoding: UTF-8   #服务编码
spring:
  application:
    name: UserApplication
  cloud:
    nacos:
      config:
        server-addr: 192.168.150.104:8848
        namespace: d287a4e1-225a-4254-bd10-947bc27f15de  # 共享配置所在命名空间 Fengluo
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: sharding-spring.yaml # 共享spring配置
            refresh: false
          - data-id: sharding-redis.yaml # 共享redis配置
            refresh: false
          - data-id: sharding-logs.yaml # 共享日志配置
            refresh: false
          - data-id: sharding-mysql.yaml
            refresh: false
          - data-id: sharding-mq.yaml
            refresh: false
          - data-id: sharding-feign.yaml
            refresh: false
  profiles:
    active: dev
fl:
  redis:
    host: 192.168.150.104   # Redis地址
    password: ''            # 若无密码则留空
    pool:
      max-active: 8
      max-idle: 8
      min-idle: 1
      max-wait: 300
  mysql:
    host: 192.168.150.104
    port: 3306
    database: fl_auth
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
  mq:
    host: localhost
    port: 5672
    vhost: /maplefall
    username: guilu
    password: 123
  auth:
    resource:
      enable: true
      # 网关匹配的是「网关可见」的完整路径：路由前缀 /user + 应用 context-path /maple + 控制器 /user。
      # 原来的 user/account/* 与真实路径完全对不上（控制器已改到 /user/login），
      # 匹配全部落空，登录只是靠「无权限规则即放行」侥幸通过。
      # 归一化后形如 *:/user/maple/user/login，与网关侧的 "METHOD:/path" 做 Ant 匹配。
      exclude-login-paths:
        - "user/maple/user/login"
        - "user/maple/user/refresh"
        - "user/maple/user/logout"
        - "admin/account/login"   # 管理端尚未实现，先留占位
monitor:
  threadpool:
    dynamic:
      enabled: true
  exception:
    enabled: false
  jvm:
    basic:
      enabled: false
    extras:
      enabled: false
