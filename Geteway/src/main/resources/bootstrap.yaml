server:
  port: 10000
spring:
  application:
    name: GatewayApplication
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: 192.168.150.104:8848
        namespace: d287a4e1-225a-4254-bd10-947bc27f15de  # 共享配置所在命名空间 Fengluo
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: sharding-spring.yaml # 共享spring配置
            group: DEFAULT_GROUP
            refresh: false
          - data-id: sharding-redis.yaml # 共享redis配置
            group: DEFAULT_GROUP
            refresh: false
          - data-id: sharding-logs.yaml # 共享日志配置
            group: DEFAULT_GROUP
            refresh: false
    gateway:
      routes:
        - id: ms
          uri: lb://media-service
          predicates:
            - Path=/ms/**
      default-filters:
        - StripPrefix=1
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "GET,POST,DELETE,PUT,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 360000