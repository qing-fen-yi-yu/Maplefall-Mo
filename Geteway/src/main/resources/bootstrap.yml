server:
  port: 10000
spring:
  application:
    name: GatewayApplication
  profiles:
    active: dev
  cloud:
    nacos:
      config:
        server-addr: 127.0.0.1:8848
        namespace: d287a4e1-225a-4254-bd10-947bc27f15de  # 共享配置所在命名空间 Fengluo
        file-extension: yaml
        shared-configs: # 共享配置
          - data-id: sharding-spring.yaml # 共享spring配置
            group: DEFAULT_GROUP
            refresh: false
          - data-id: sharding-redis.yaml # 共享redis配置
            group: DEFAULT_GROUP
            refresh: false
          - data-id: sharding-logs.yaml # 共享日志配置
            group: DEFAULT_GROUP
            refresh: false
    gateway:
      routes:
      #user服务过滤器配置
        - id: user
          uri: lb://UserApplication
          predicates:
            - Path=/user/**
      default-filters:
        - StripPrefix=1 #省略路径中的第一个参数
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "GET,POST,DELETE,PUT,OPTIONS"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 360000
fl:
  auth:
    resource:
      enable: true